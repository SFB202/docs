openapi: 3.0.3
info:
  title: SFB202 API
  version: 0.1.0
  description: |
    ReDoc용 OpenAPI 초안.
    ※ "API 가버전" 문서에는 엔드포인트/메서드 중심으로만 나와 있어 요청/응답 스키마는 임시(TODO)로 작성됨.

servers:
  - url: https://api.example.com
    description: TODO - 실제 API 서버 도메인으로 교체

tags:
  - name: Auth
    description: 로그인/로그아웃
  - name: MyPage
    description: 마이페이지
  - name: Lounge
    description: 라운지
  - name: MeetingRoom
    description: 회의실
  - name: Leader
    description: 팀장

security:
  - cookieAuth: []

paths:
  /api/v1/auth/login:
    get:
      tags: [Auth]
      summary: 로그인 (GitHub OAuth Redirect)
      description: GitHub OAuth 인증을 위해 리다이렉트합니다.
      security: [] # 로그인 전이므로 보통 보안 미적용
      responses:
        "302":
          description: Redirect to GitHub OAuth
          headers:
            Location:
              description: GitHub OAuth authorize URL
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms:
    get:
      tags: [MyPage]
      summary: 방 목록 확인
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Leader]
      summary: 방 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              name: "프로젝트 A"
              repoId: 123456789
              repoFullName: "org/repo"
              thumbnailUrl: "https://example.com/thumb.png"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    patch:
      tags: [MyPage]
      summary: 프로필 사진 수정
      description: |
        TODO - 실제 구현에 맞춰 multipart/form-data 또는 JSON 중 하나로 확정 필요.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required: [avatar]
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/meetings:
    get:
      tags: [Lounge]
      summary: 회의록 리스트 불러오기
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Meetings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rooms/{id}/participants:
    get:
      tags: [Lounge]
      summary: 참여자 목록 불러오기
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseParticipantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rooms/{id}/sessions:
    post:
      tags: [Lounge]
      summary: 회의실 생성
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            example:
              name: "회의실 1"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/meetings/recent:
    get:
      tags: [Lounge]
      summary: 최근 회의록 3개 불러오기
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Recent meetings (max 3)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/sessions/{sId}:
    delete:
      tags: [Lounge]
      summary: 회의실 삭제
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Lounge]
      summary: 회의실 이름 수정
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
            example:
              name: "새 회의실 이름"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/issues/active:
    get:
      tags: [Lounge]
      summary: 진행중인 이슈 5개 불러오기
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 50
          description: 기본 5
      responses:
        "200":
          description: Active issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseIssueList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/calendar:
    post:
      tags: [Lounge]
      summary: 캘린더 생성
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarRequest"
            example:
              title: "회의 일정"
              startAt: "2026-01-15T09:00:00+09:00"
              endAt: "2026-01-15T10:00:00+09:00"
      responses:
        "201":
          description: Calendar created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCalendar"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/calendar/{cId}:
    patch:
      tags: [Lounge]
      summary: 캘린더 수정
      parameters:
        - $ref: "#/components/parameters/CalendarId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarRequest"
      responses:
        "200":
          description: Calendar updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCalendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Lounge]
      summary: 캘린더 삭제
      parameters:
        - $ref: "#/components/parameters/CalendarId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rooms/{id}/meetings/search:
    get:
      tags: [Lounge]
      summary: 전체 회의록 검색
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 검색어
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/chats:
    get:
      tags: [MeetingRoom]
      summary: 텍스트 채팅 불러오기
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: beforeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: TODO - 페이징 방식에 맞춰 변경(커서/offset 등)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Chat list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseChatList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/chats/{chatId}:
    patch:
      tags: [MeetingRoom]
      summary: 채팅 수정
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatRequest"
            example:
              content: "수정된 메시지"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseChat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [MeetingRoom]
      summary: 채팅 삭제
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rooms/{id}/meetings/join:
    post:
      tags: [MeetingRoom]
      summary: 음성 대화 참여
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinMeetingRequest"
      responses:
        "200":
          description: Join token / connection info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseJoinInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/meetings/{id}/screen:
    put:
      tags: [MeetingRoom]
      summary: 화면 공유
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScreenShareRequest"
      responses:
        "200":
          description: Screen share state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/issues:
    post:
      tags: [MeetingRoom]
      summary: 이슈 생성
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
            example:
              title: "버그 수정"
              body: "재현 경로: ..."
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/meetings/{id}/summary:
    post:
      tags: [MeetingRoom]
      summary: 회의록 생성
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingSummaryRequest"
      responses:
        "201":
          description: Summary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMeeting"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/meetings/{mId}/record/start:
    post:
      tags: [MeetingRoom]
      summary: 회의 녹음 시작
      parameters:
        - $ref: "#/components/parameters/MeetingRecordId"
      responses:
        "200":
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/meetings/{mId}/record/stop:
    post:
      tags: [MeetingRoom]
      summary: 회의 녹음 종료
      parameters:
        - $ref: "#/components/parameters/MeetingRecordId"
      responses:
        "200":
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/meetings/{mId}/leave:
    delete:
      tags: [MeetingRoom]
      summary: 회의실 나가기
      parameters:
        - $ref: "#/components/parameters/MeetingRecordId"
      responses:
        "204":
          description: Left meeting
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/repos:
    get:
      tags: [Leader]
      summary: 프로젝트 불러오기
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/assign:
    patch:
      tags: [Leader]
      summary: 위임자 선정
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLeaderRequest"
            example:
              assigneeUserId: 1002
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/members:
    post:
      tags: [Leader]
      summary: 팀원 추가
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
            example:
              userId: 1003
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseParticipantList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/rooms/{id}/members/{uId}:
    delete:
      tags: [Leader]
      summary: 팀원 삭제
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/user/orgs:
    get:
      tags: [Leader]
      summary: 조직 목록 조회
      responses:
        "200":
          description: Orgs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrgList"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 세션 쿠키 (예: JSESSIONID). TODO - 실제 쿠키명으로 변경

  parameters:
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 방 ID
    SessionId:
      name: sId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 세션(회의실) ID
    CalendarId:
      name: cId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 캘린더 ID
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 채팅 ID
    MeetingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 회의 ID
    MeetingRecordId:
      name: mId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 회의 ID
    UserId:
      name: uId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 사용자 ID
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 200

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ===== 공통 응답 래퍼 (TODO - 실제 서버 응답 포맷에 맞춰 수정) =====
    ApiResponseEmpty:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
          example: null
        message:
          type: string
          example: "OK"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "BAD_REQUEST"
            message:
              type: string
              example: "Invalid input"
            details:
              nullable: true

    # ===== 도메인 스키마 (초안) =====
    Room:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        ownerId: { type: integer, format: int64 }
        repoId: { type: integer, format: int64, nullable: true }
        repoFullName: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    Meeting:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }

    Participant:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        role:
          type: string
          nullable: true
          description: TODO - owner/member 등

    Chat:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    Issue:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string, nullable: true }
        status:
          type: string
          example: "ACTIVE"
        createdAt: { type: string, format: date-time, nullable: true }

    Calendar:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        title: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }

    Repo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        private: { type: boolean, nullable: true }

    Org:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        login: { type: string }
        avatarUrl: { type: string, nullable: true }

    Session:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        name: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    JoinInfo:
      type: object
      properties:
        token:
          type: string
          description: TODO - WebRTC/OpenVidu/기타 연결 토큰
        serverUrl:
          type: string
          nullable: true

    # ===== 요청 바디 =====
    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        repoId: { type: integer, format: int64, nullable: true }
        repoFullName: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }

    CreateSessionRequest:
      type: object
      properties:
        name: { type: string, nullable: true }

