openapi: 3.0.3

info:
  title: SFB202 API (Draft)
  version: "0.0.1"
  description: "API 가버전 기반 OpenAPI 초안. Request/Response 스키마(바디)는 추후 확정 전이라 생략."

servers:
  - url: https://api.example.com
    description: "TODO: 실제 API 서버 URL로 교체"

tags:
  - name: Auth
    description: "로그인/로그아웃"
  - name: MyPage
    description: "마이페이지"
  - name: Lounge
    description: "라운지"
  - name: MeetingRoom
    description: "회의실"
  - name: Leader
    description: "팀장"

security:
  - cookieAuth: []

paths:
  /api/v1/auth/login:
    get:
      tags: [Auth]
      summary: "로그인"
      description: "GitHub OAuth Redirect"
      security: []
      responses:
        "200":
          description: "OK"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: "로그아웃"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms:
    get:
      tags: [MyPage]
      summary: "방 목록 확인"
      responses:
        "200":
          description: "OK"
    post:
      tags: [Leader]
      summary: "방 생성"
      responses:
        "200":
          description: "OK"

  /api/v1/users/me:
    patch:
      tags: [MyPage]
      summary: "프로필 사진 수정"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/meetings:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [Lounge]
      summary: "회의록 리스트 불러오기"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/participants:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [Lounge]
      summary: "참여자 목록 불러오기"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [Lounge]
      summary: "회의실 생성"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/meetings/recent:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [Lounge]
      summary: "최근 회의록 3개 불러오기"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/sessions/{sId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Lounge]
      summary: "회의실 삭제"
      responses:
        "200":
          description: "OK"
    patch:
      tags: [Lounge]
      summary: "회의실 이름 수정"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/issues/active:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [Lounge]
      summary: "진행중인 이슈 5개 불러오기"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/calendar:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [Lounge]
      summary: "캘린더 생성"
      responses:
        "200":
          description: "OK"

  /api/v1/calendar/{cId}:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    patch:
      tags: [Lounge]
      summary: "캘린더 수정"
      responses:
        "200":
          description: "OK"
    delete:
      tags: [Lounge]
      summary: "캘린더 삭제"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/meetings/search:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [Lounge]
      summary: "전체 회의록 검색"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/chats:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [MeetingRoom]
      summary: "텍스트 채팅 불러오기"
      responses:
        "200":
          description: "OK"

  /api/v1/chats/{chatId}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    patch:
      tags: [MeetingRoom]
      summary: "채팅 수정"
      responses:
        "200":
          description: "OK"
    delete:
      tags: [MeetingRoom]
      summary: "채팅 삭제"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/meetings/join:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [MeetingRoom]
      summary: "음성 대화"
      responses:
        "200":
          description: "OK"

  /api/v1/meetings/{id}/screen:
    parameters:
      - $ref: "#/components/parameters/MeetingId"
    put:
      tags: [MeetingRoom]
      summary: "화면 공유"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/issues:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [MeetingRoom]
      summary: "이슈 생성"
      responses:
        "200":
          description: "OK"

  /api/v1/meetings/{id}/summary:
    parameters:
      - $ref: "#/components/parameters/MeetingId"
    post:
      tags: [MeetingRoom]
      summary: "회의록 생성"
      responses:
        "200":
          description: "OK"

  /api/v1/meetings/{mId}/record/start:
    parameters:
      - $ref: "#/components/parameters/MeetingRecordId"
    post:
      tags: [MeetingRoom]
      summary: "회의 녹음 시작"
      responses:
        "200":
          description: "OK"

  /api/v1/meetings/{mId}/record/stop:
    parameters:
      - $ref: "#/components/parameters/MeetingRecordId"
    post:
      tags: [MeetingRoom]
      summary: "회의 녹음 종료"
      responses:
        "200":
          description: "OK"

  /api/v1/meetings/{mId}/leave:
    parameters:
      - $ref: "#/components/parameters/MeetingRecordId"
    delete:
      tags: [MeetingRoom]
      summary: "회의실 나가기"
      responses:
        "200":
          description: "OK"

  /api/v1/repos:
    get:
      tags: [Leader]
      summary: "프로젝트 불러오기"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    patch:
      tags: [Leader]
      summary: "위임자 선정"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/members:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [Leader]
      summary: "팀원 추가"
      responses:
        "200":
          description: "OK"

  /api/v1/rooms/{id}/members/{uId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Leader]
      summary: "팀원 삭제"
      responses:
        "200":
          description: "OK"

  /api/v1/user/orgs:
    get:
      tags: [Leader]
      summary: "조직 목록 조회"
      responses:
        "200":
          description: "OK"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: "세션 쿠키"

  parameters:
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "Room ID"

    SessionId:
      name: sId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "Session ID"

    CalendarId:
      name: cId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "Calendar ID"

    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "Chat ID"

    MeetingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "Meeting ID"

    MeetingRecordId:
      name: mId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "Meeting ID"

    UserId:
      name: uId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "User ID"
