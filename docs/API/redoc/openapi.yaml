openapi: 3.0.3
info:
  title: Didit Server API
  version: "v1"
  description: |
    기본 경로(Base path): /api/v1
    GitHub OAuth2 기반 세션 쿠키(JSESSIONID)로 인증합니다.
servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 환경
  - url: https://api.did-it.xyz/api/v1
    description: 배포된 서버
tags:
  - name: Auth
  - name: Projects
  - name: Invites
  - name: Meetings
  - name: Chat
  - name: SSE
  - name: Issues
  - name: Webhooks
security:
  - cookieAuth: []
paths:
  /auth/login:
    get:
      tags: [Auth]
      summary: GitHub OAuth 로그인으로 리다이렉트
      security: []
      responses:
        "302":
          description: `/oauth2/authorization/github` 로 리다이렉트
          headers:
            Location:
              schema:
                type: string

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃 및 세션 쿠키 제거
      security: []
      responses:
        "200":
          description: 로그아웃 완료

  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 인증된 사용자 조회
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 인증되지 않음(Unauthorized)

  /projects:
    get:
      tags: [Projects]
      summary: 로그인한 사용자의 프로젝트 목록 조회
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
    post:
      tags: [Projects]
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectRequest"
      responses:
        "200":
          description: 생성 완료

  /projects/recents:
    get:
      tags: [Projects]
      summary: 최근 조회한 프로젝트 목록 조회
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRecentResponse"

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: 프로젝트 상세 조회
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    delete:
      tags: [Projects]
      summary: 프로젝트 삭제(소유자만)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 삭제 완료
    patch:
      tags: [Projects]
      summary: 프로젝트 저장소 정보(repo) 업데이트
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepoRequest"
      responses:
        "200":
          description: 업데이트 완료

  /projects/{projectId}/participants:
    get:
      tags: [Projects]
      summary: 프로젝트 참여자 목록 조회
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"

  /projects/{projectId}/participants/{userId}:
    delete:
      tags: [Projects]
      summary: 참여자 제거(소유자만)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 제거 완료

  /projects/{projectId}/leave:
    delete:
      tags: [Projects]
      summary: 프로젝트 탈퇴
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 탈퇴 완료

  /projects/{projectId}/github/validate:
    post:
      tags: [Projects]
      summary: 프로젝트의 GitHub 저장소 유효성 검증
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateGithubRequest"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubRepoResponse"

  /projects/{projectId}/owner:
    patch:
      tags: [Projects]
      summary: 프로젝트 소유권 이전
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnerRequest"
      responses:
        "200":
          description: 이전 완료

  /projects/{projectId}/name:
    patch:
      tags: [Projects]
      summary: 프로젝트 이름 변경
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectNameRequest"
      responses:
        "200":
          description: 변경 완료

  /projects/invites:
    post:
      tags: [Invites]
      summary: 초대 코드 생성(관리자만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectInviteRequest"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: string
                format: uuid

  /projects/invites/{inviteCode}:
    get:
      tags: [Invites]
      summary: 초대 코드로 프로젝트 조회
      parameters:
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: 잘못된 요청(잘못된 UUID)
    post:
      tags: [Invites]
      summary: 초대 코드로 프로젝트 참여
      parameters:
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "200":
          description: 참여 완료
        "400":
          description: 잘못된 요청(잘못된 UUID)

  /projects/{projectId}/add-channel:
    post:
      tags: [Meetings]
      summary: 회의(채널) 생성(관리자만, 상태 RUNNING)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
      responses:
        "200":
          description: 생성된 meeting id
          content:
            application/json:
              schema:
                type: integer
                format: int64

  /projects/{projectId}/book-channel:
    post:
      tags: [Meetings]
      summary: 회의(채널) 예약(관리자만, 상태 SCHEDULED)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookMeetingRequest"
      responses:
        "200":
          description: 생성된 meeting id
          content:
            application/json:
              schema:
                type: integer
                format: int64
        "400":
          description: 잘못된 요청(시작 시간이 종료 시간보다 늦음)

  /projects/{projectId}/channels:
    get:
      tags: [Meetings]
      summary: 프로젝트 내 회의(채널) 목록 조회
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MeetingStatus"
        - name: cursor
          in: query
          description: 이전 페이지의 마지막 항목 id(첫 페이지는 0)
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingResponse"

  /projects/{projectId}/channels/date:
    get:
      tags: [Meetings]
      summary: 기간 범위로 프로젝트 회의(채널) 목록 조회
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingResponse"

  /channels/{channelId}:
    get:
      tags: [Meetings]
      summary: 회의(채널) 상세 조회
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingResponse"
    patch:
      tags: [Meetings]
      summary: 회의 제목 및/또는 시간 범위 수정
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - name: title
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: due
          in: query
          description: 종료 시간
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 수정 완료
    delete:
      tags: [Meetings]
      summary: 회의(채널) 삭제
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: 삭제 완료

  /channels/{channelId}/webrtc:
    post:
      tags: [Meetings]
      summary: VOICE 회의(WebRTC) 참여
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: 연결 토큰(Connection token)
          content:
            application/json:
              schema:
                type: string
        "409":
          description: 충돌(회의 모드가 VOICE가 아님)
    delete:
      tags: [Meetings]
      summary: VOICE 회의(WebRTC) 퇴장
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: 퇴장 완료
        "409":
          description: 충돌(회의 모드가 VOICE가 아님)

  /channels/{channelId}/webrtc/users:
    get:
      tags: [Meetings]
      summary: VOICE 회의에 연결된 사용자 목록 조회
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "409":
          description: 충돌(회의 모드가 VOICE가 아님)

  /channels/{channelId}/recording/start:
    post:
      tags: [Meetings]
      summary: VOICE 회의 녹화 시작
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: 녹화 id
          content:
            application/json:
              schema:
                type: integer
                format: int64
        "409":
          description: 충돌(회의 모드가 VOICE가 아님)

  /channels/{channelId}/recording/stop/{recordId}:
    post:
      tags: [Meetings]
      summary: VOICE 회의 녹화 중지
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: 중지 완료
        "409":
          description: 충돌(회의 모드가 VOICE가 아님)

  /channels/{channelId}/chats:
    post:
      tags: [Chat]
      summary: 채널에 채팅 메시지 전송
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: 전송 완료
    get:
      tags: [Chat]
      summary: 채널의 채팅 메시지 목록 조회
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - name: lastId
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatResponse"

  /channels/chats/{chatId}:
    patch:
      tags: [Chat]
      summary: 채팅 메시지 수정(작성자만)
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatMessage"
      responses:
        "200":
          description: 수정 완료
    delete:
      tags: [Chat]
      summary: 채팅 메시지 삭제(작성자만)
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: 삭제 완료

  /channels/{channelId}/stream:
    get:
      tags: [SSE]
      summary: 채널 SSE 스트림 구독
      description: |
        채널의 채팅 및 미디어 이벤트를 전송합니다.
        참고: `chat_update`와 `chat_delete`는 projectId를 채널 id로 사용해 브로드캐스트됩니다.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                message:
                  summary: message
                  value: |
                    event: message
                    data: {"channelId":1,"senderId":10,"content":"Hello","sentAtEpochMs":1738209000000}
                chat_update:
                  summary: chat_update
                  value: |
                    event: chat_update
                    data: {"chatId":1000,"content":"Edited","editedAt":"2026-01-26T14:30:00"}
                chat_delete:
                  summary: chat_delete
                  value: |
                    event: chat_delete
                    data: {"chatId":1000,"content":"Original message"}
                media_participant_joined:
                  summary: media_participant_joined
                  value: |
                    event: media_participant_joined
                    data: {"channelId":1,"timestamp":"2026-01-26T14:30:00","sessionId":"session-id","connectionId":"conn-id","user":{"id":10,"githubId":999999,"githubLogin":"octocat","name":"Octo Cat","avatarUrl":"https://...","createdAt":"2026-01-26T14:30:00","lastLoginAt":"2026-01-26T14:30:00"}}
                media_participant_left:
                  summary: media_participant_left
                  value: |
                    event: media_participant_left
                    data: {"channelId":1,"timestamp":"2026-01-26T14:30:00","sessionId":"session-id","connectionId":"conn-id","user":{"id":10,"githubId":999999,"githubLogin":"octocat","name":"Octo Cat","avatarUrl":"https://...","createdAt":"2026-01-26T14:30:00","lastLoginAt":"2026-01-26T14:30:00"}}
                media_recording_start:
                  summary: media_recording_start
                  value: |
                    event: media_recording_start
                    data: {"channelId":1,"timestamp":"2026-01-26T14:30:00","sessionId":"session-id"}
                media_recording_stop:
                  summary: media_recording_stop
                  value: |
                    event: media_recording_stop
                    data: {"channelId":1,"timestamp":"2026-01-26T14:30:00","sessionId":"session-id"}
                media_error:
                  summary: media_error
                  value: |
                    event: media_error
                    data: {"channelId":1,"errorResponse":{"statusCode":"INTERNAL_SERVER_ERROR","message":"..."}}
                ping:
                  summary: ping
                  value: |
                    event: ping
                    data: ""
          x-sse-events:
            - name: message
              payload:
                $ref: "#/components/schemas/SseMessagePayload"
            - name: chat_update
              payload:
                $ref: "#/components/schemas/SseChatUpdatePayload"
            - name: chat_delete
              payload:
                $ref: "#/components/schemas/SseChatDeletePayload"
            - name: media_participant_joined
              payload:
                $ref: "#/components/schemas/SseMediaParticipantPayload"
            - name: media_participant_left
              payload:
                $ref: "#/components/schemas/SseMediaParticipantPayload"
            - name: media_recording_start
              payload:
                $ref: "#/components/schemas/SseMediaRecordingPayload"
            - name: media_recording_stop
              payload:
                $ref: "#/components/schemas/SseMediaRecordingPayload"
            - name: media_error
              payload:
                $ref: "#/components/schemas/SseMediaErrorPayload"
            - name: ping
              payload:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /projects/{projectId}/stream:
    get:
      tags: [SSE]
      summary: 프로젝트 SSE 스트림 구독
      description: AI 정렬 결과 및 ping 이벤트를 전송합니다.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                ai_sort_result:
                  summary: ai_sort_result
                  value: |
                    event: ai_sort_result
                    data: [100,101,102]
                ping:
                  summary: ping
                  value: |
                    event: ping
                    data: ""
          x-sse-events:
            - name: ai_sort_result
              payload:
                $ref: "#/components/schemas/SseAiSortResultPayload"
            - name: ping
              payload:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /projects/{projectId}/issues/active:
    get:
      tags: [Issues]
      summary: 프로젝트의 활성 이슈(최대 5개) 조회
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueResponse"

  /projects/{projectId}/issues:
    get:
      tags: [Issues]
      summary: 프로젝트의 모든 이슈 조회
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueResponse"
    post:
      tags: [Issues]
      summary: 드래프트 이슈로부터 GitHub 이슈 생성
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueResponse"

  /projects/{projectId}/issue/analyze:
    post:
      tags: [Issues]
      summary: 이슈 우선순위 분석(드래프트 생성 + 비동기 AI)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeIssueRequest"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiResponse"

  /projects/{projectId}/issues/{issueId}:
    patch:
      tags: [Issues]
      summary: 이슈 수정(작성자만)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: 수정 완료
    delete:
      tags: [Issues]
      summary: 이슈 삭제(작성자만)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: 삭제 완료

  /webhooks/openvidu:
    post:
      tags: [Webhooks]
      summary: OpenVidu 웹훅 엔드포인트
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 성공
        "401":
          description: 인증 실패(잘못된 X-OpenVidu-Token)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IssueId:
      name: issueId
